input {
  http {
    port => 5044
    codec => "json"
  }
}

filter {
  if [resourceLogs] {
    split {
      field => "resourceLogs"
    }
  }
  if [resourceLogs][scopeLogs] {
    split {
      field => "[resourceLogs][scopeLogs]"
    }
  }
  if [resourceLogs][scopeLogs][logRecords] {
    split {
      field => "[resourceLogs][scopeLogs][logRecords]"
    }
  }

  ruby {
    code => '
      # Extract resource attributes (like service.name)
      resource_attrs = event.get("[resourceLogs][resource][attributes]")
      if resource_attrs.is_a?(Array)
        resource_attrs.each do |attr|
          key = attr["key"]
          val = attr["value"]
          if val
            actual_val = val["stringValue"] || val["intValue"] || val["doubleValue"] || val["boolValue"]
            event.set(key, actual_val)
          end
        end
      end

      # Extract log record details
      log_record = event.get("[resourceLogs][scopeLogs][logRecords]")
      if log_record.is_a?(Hash)
        # Extract body
        body = log_record["body"]
        if body
          event.set("message", body["stringValue"] || body["intValue"] || body["doubleValue"] || body["boolValue"])
        end

        # Extract timestamp
        time_nano = log_record["timeUnixNano"]
        if time_nano
          event.set("@timestamp", LogStash::Timestamp.new(Time.at(time_nano.to_i / 1000000000.0)))
        end

        # Extract severity/level
        event.set("level", log_record["severityText"])

        # Extract record attributes (traceId, spanId, userId, logger, thread)
        record_attrs = log_record["attributes"]
        if record_attrs.is_a?(Array)
          record_attrs.each do |attr|
            key = attr["key"]
            val = attr["value"]
            if val
              actual_val = val["stringValue"] || val["intValue"] || val["doubleValue"] || val["boolValue"]
              event.set(key, actual_val)
            end
          end
        end

        # Extract direct traceId / spanId if present
        if log_record["traceId"] && !log_record["traceId"].empty?
          event.set("traceId", log_record["traceId"])
        end
        if log_record["spanId"] && !log_record["spanId"].empty?
          event.set("spanId", log_record["spanId"])
        end
      end

      # Extract instrumentation scope name as logger if logger is not set
      scope = event.get("[resourceLogs][scopeLogs][scope]")
      if scope && scope["name"] && !event.get("logger")
        event.set("logger", scope["name"])
      end
    '
  }

  if [thread.name] {
    mutate {
      rename => { "[thread.name]" => "[thread]" }
    }
  }

  if [service.name] {
    mutate {
      rename => { "[service.name]" => "[service]" }
    }
  }

  if ![service] or [service] == "" {
    mutate {
      add_field => { "service" => "unknown" }
    }
  }

  if [level] {
    mutate {
      uppercase => [ "level" ]
    }
  }

  if ![userId] {
    mutate {
      add_field => { "userId" => "" }
    }
  }

  mutate {
    remove_field => ["resourceLogs", "headers", "host", "@version"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "logs-%{[service]}-%{+YYYY.MM.dd}"
    action => "create"
  }
}
