logging.level.root=info
# swagger-ui custom path
springdoc.swagger-ui.path=/swagger-ui.html
#This configuration file will hold common configs to be shared among all files
eureka.client.service-url.defaultZone=http://localhost:9999/eureka/
#where our registry server is located
eureka.instance.prefer-ip-address=true
#when the application registers with eureka, true: it uses its IP address rather than its hostname

# Expose all the Actuator endpoints
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.info.env.enabled=true

# AOP auto enabling
spring.aop.auto=true

#logging
# logging.file.name=myapp.log
# logging.logback.rollingpolicy.max-file-size=2MB
# logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]
# logging.include-application-name=false

# Logging profiles:
#   Default / dev: colored console output for local dev
#   prod: structured JSON to stdout for Docker/Loki/Elasticsearch
#   Activate with: SPRING_PROFILES_ACTIVE=prod

# OpenTelemetry OTLP Configuration
management.otlp.tracing.endpoint=${OTEL_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
management.otlp.metrics.export.url=${OTEL_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
management.otlp.logs.endpoint=${OTEL_LOGS_ENDPOINT:http://localhost:4318/v1/logs}
management.otlp.logging.endpoint=${OTEL_LOGS_ENDPOINT:http://localhost:4318/v1/logs}
management.otlp.logs.export.enabled=true
management.tracing.sampling.probability=1.0

# Reactive Stream context propagation for Trace ID in logs
reactor.context-propagation=auto
