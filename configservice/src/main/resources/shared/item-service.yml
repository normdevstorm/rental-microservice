server:
  port: 8083
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/rental_item?verifyServerCertificate=false&useSSL=true
    username: nam
    password: nam123
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  sql:
    init:
      mode: always
logging:
  level:
    root: info
    org:
      springframework: info
      hibernate:
        sql: info
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: basic
api:
  server:
    url: http://localhost:8080/item
